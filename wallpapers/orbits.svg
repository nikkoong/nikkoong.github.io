<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b18"/><stop offset="1" stop-color="#171426"/>
    </linearGradient>
    <linearGradient id="g-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a06bff"/><stop offset="1" stop-color="#5b28d8"/>
    </linearGradient>
    <linearGradient id="g-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54e0ff"/><stop offset="1" stop-color="#0a8ad8"/>
    </linearGradient>
    <linearGradient id="g-pink" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5f9e"/><stop offset="1" stop-color="#c02bd8"/>
    </linearGradient>
    <linearGradient id="g-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc857"/><stop offset="1" stop-color="#ff7a2e"/>
    </linearGradient>
    <filter id="g-blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="55"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#g-base)"/>
  <g filter="url(#g-blur)" opacity=".85">
    <circle cx="340" cy="300" r="230" fill="url(#g-purple)"/>
    <circle cx="1260" cy="240" r="300" fill="url(#g-cyan)"/>
    <circle cx="1350" cy="760" r="260" fill="url(#g-pink)"/>
    <circle cx="300" cy="760" r="220" fill="url(#g-amber)"/>
    <circle cx="820" cy="520" r="180" fill="url(#g-purple)"/>
    <circle cx="1050" cy="900" r="170" fill="url(#g-cyan)"/>
  </g>
</svg>
