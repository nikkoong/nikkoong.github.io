<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="a-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1230"/><stop offset=".5" stop-color="#1a1440"/><stop offset="1" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="a-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d9fff"/><stop offset="1" stop-color="#1b6de8"/>
    </linearGradient>
    <linearGradient id="a-pink" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6ea8"/><stop offset="1" stop-color="#c049e0"/>
    </linearGradient>
    <linearGradient id="a-mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54e0c4"/><stop offset="1" stop-color="#0fa18a"/>
    </linearGradient>
    <linearGradient id="a-gold" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76e"/><stop offset="1" stop-color="#f08a2e"/>
    </linearGradient>
    <filter id="a-blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="a-blur-s" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#a-base)"/>
  <g filter="url(#a-blur)" opacity=".9">
    <ellipse cx="1300" cy="150" rx="620" ry="420" fill="url(#a-blue)"/>
    <ellipse cx="180" cy="850" rx="600" ry="460" fill="url(#a-pink)"/>
    <ellipse cx="900" cy="900" rx="520" ry="380" fill="url(#a-mint)"/>
    <ellipse cx="420" cy="180" rx="360" ry="260" fill="url(#a-gold)"/>
  </g>
  <g filter="url(#a-blur-s)" opacity=".85">
    <ellipse cx="1150" cy="620" rx="420" ry="300" fill="url(#a-pink)"/>
    <ellipse cx="560" cy="560" rx="300" ry="220" fill="url(#a-blue)"/>
  </g>
</svg>
